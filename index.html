    };
    document.querySelectorAll('.del-ev').forEach(b=>{b.onclick=()=>{p.timeline=p.timeline.filter(ev=>ev.id!==b.dataset.evid);sync();rf()}});
    document.querySelectorAll('.cs-tag .x').forEach(x=>{x.onclick=()=>{p.tags.splice(parseInt(x.dataset.ti),1);sync();rf()}});
    document.getElementById('tagIn').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();const v=e.target.value.trim();if(v&&!p.tags.includes(v)){p.tags.push(v);sync();rf()}}};

    const vtl=document.getElementById('vTL');
    if(vtl)vtl.onclick=()=>{sync();if(!isN){const idx=papers.findIndex(x=>x.id===p.id);if(idx>=0)papers[idx]=p;saveL()}editing=null;rmF();detailId=p.id;render()};

    document.querySelectorAll('.go').forEach(g=>{g.onclick=()=>{sync();if(!isN){const idx=papers.findIndex(x=>x.id===p.id);if(idx>=0)papers[idx]=p;saveL()}editing=null;rmF();detailId=g.dataset.goid;render()}});

    document.getElementById('fSv').onclick=()=>{
      sync();if(!p.title.trim()){toast('Please enter a title','error');return}
      const wkVal=document.getElementById('fWk').value;
      if(wkVal==='__new__'){p.workId=uid()}
      else if(wkVal){p.workId=wkVal}
      else{p.workId=''}

      p.id=p.id||uid();
      if(isN)papers.push(p);else{const idx=papers.findIndex(x=>x.id===p.id);if(idx>=0)papers[idx]=p}
      editing=null;rmF();persist();
    };
    const dl=document.getElementById('fDl');if(dl)dl.onclick=()=>{if(confirm('Delete this submission?')){papers=papers.filter(x=>x.id!==p.id);editing=null;rmF();persist()}};

    function sync(){
      p.title=document.getElementById('fT')?.value||p.title;
      p.journal=document.getElementById('fJ')?.value||'';
      p.role=document.getElementById('fR')?.value||'first';
      const authorPositionValue=document.getElementById('fAP')?.value.trim()||'';
      p.authorPosition=p.role==='other'&&/^[1-9]\d*$/.test(authorPositionValue)?parseInt(authorPositionValue,10):'';
      p.manuscriptId=document.getElementById('fM')?.value||'';
      p.submittedDate=document.getElementById('fD')?.value||'';
      p.trackingUrl=document.getElementById('fU')?.value||'';
      p.coAuthors=document.getElementById('fA')?.value||'';
      p.notes=document.getElementById('fN')?.value||'';
      p.priority=parseInt(document.getElementById('fPr')?.value||'1');
      p.deadline=p.status==='revision'?(document.getElementById('fDL')?.value||''):'';
      if(!p.account)p.account={};
      p.account.username=document.getElementById('fAccUser')?.value||'';
      p.account.password=document.getElementById('fAccPass')?.value||'';
    }
  }
  rf();setTimeout(()=>document.getElementById('fT')?.focus(),80);
}

function showReviewForm(isN){
  const r=isN?{id:'',journal:'',paperTitle:'',round:1,inviteDate:td(),dueDate:'',decision:'',link:'',notes:'',status:'pending',timeline:[],account:{},reviewWorkId:''}:{...editing,timeline:[...(editing.timeline||[])]};

  let ov=document.getElementById('f-ov');if(!ov){ov=document.createElement('div');ov.id='f-ov';ov.className='mo';document.body.appendChild(ov)}

  function rf(){
    let decOpts='';RV_DEC.forEach(d=>{decOpts+=`<option value="${d.key}" ${r.decision===d.key?'selected':''}>${d.emoji} ${d.label}</option>`});
    const tl=(r.timeline||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    let tlH='';tl.forEach(ev=>{tlH+=`<div class="tl-ev"><div class="dot" style="background:${ev.color||'#94a3b8'}"></div><div class="date">${fD(ev.date)}</div><div class="label">${esc(ev.label)}</div>${ev.note?`<div class="note">${esc(ev.note)}</div>`:''}<button class="del-ev" data-evid="${ev.id}">✕</button></div>`});

    const reviewWorkIds=[...new Set(reviews.filter(x=>x.reviewWorkId&&x.id!==r.id).map(x=>x.reviewWorkId))];
    let workOpts='<option value="">(No link; independent review)</option><option value="__new__">+ Create New Review Group (same manuscript)</option>';
    reviewWorkIds.forEach(wid=>{
      const first=reviews.find(x=>x.reviewWorkId===wid);
      const sel=r.reviewWorkId===wid?'selected':'';
      workOpts+=`<option value="${wid}" ${sel}>${esc((first?.paperTitle||'').slice(0,30))} (${getReviewWorkCount(wid)} rounds)</option>`;
    });

    // Review event presets
    let rvEvH='';RV_EVENTS.forEach(e=>{rvEvH+=`<option value="${e}">`});

    ov.innerHTML=`<div class="md"><div class="mh"><h2>${isN?'📪 New Peer Review':'✏️ Edit Peer Review'}</h2><button class="xbtn" id="fX">✕</button></div><div>
    <div class="fg"><label class="fl">Review Journal *</label><input class="fi rev" id="rvJ" value="${esc(r.journal)}" placeholder="Journal name..."></div>
    <div class="fg"><label class="fl">Paper Title</label><input class="fi rev" id="rvT" value="${esc(r.paperTitle)}" placeholder="Manuscript title..."></div>
    <div class="fr"><div class="fg"><label class="fl">Invitation Date</label><input type="date" class="fi" id="rvI" value="${r.inviteDate||''}"></div><div class="fg"><label class="fl">Due Date</label><input type="date" class="fi" id="rvD" value="${r.dueDate||''}"></div><div class="fg nw2"><label class="fl">Round</label><input type="number" class="fi" id="rvR" value="${r.round||1}" min="1"></div></div>
    <div class="fg"><label class="fl">Review Decision</label><select class="fi rev" id="rvDec">${decOpts}</select></div>
    <div class="fg"><label class="fl">Review System Link</label><input class="fi rev" id="rvL" value="${esc(r.link)}" placeholder="https://..."></div>
    <div class="fg"><label class="fl">Review Notes</label><textarea class="fi" id="rvN" rows="3" placeholder="Assessment, major issues...">${esc(r.notes||'')}</textarea></div>

    <div class="fg" style="background:var(--ibg);padding:10px;border-radius:7px;margin-top:10px"><label class="fl">Review System Account (optional)</label>
      <div class="fr" style="gap:10px">
        <div class="fg" style="flex:1;margin-bottom:0"><input class="fi" id="rvAccUser" value="${esc(r.account?.username||'')}" placeholder="Username / email"></div>
        <div class="fg" style="flex:1;margin-bottom:0;position:relative"><input class="fi" id="rvAccPass" type="password" value="${esc(r.account?.password||'')}" placeholder="Password"><button type="button" onclick="toggleFormPwd('rvAccPass')" style="position:absolute;right:8px;top:28px;background:none;border:none;cursor:pointer;font-size:12px;color:var(--t3)">👁️</button></div>
      </div>
    </div>

    <div class="hist-sec"><h3>🔗 Linked Reviews (multiple rounds for the same manuscript)</h3>
    <div class="fg"><label class="fl">Link to an Existing Review Group</label><select class="fi" id="rvWk">${workOpts}</select></div>
    <div style="font-size:10px;color:var(--t3);margin-top:4px">Link multiple review invitations for the same manuscript to preserve its review history.</div>
    </div>

    <div class="tls"><h3>📅 Review Timeline <span style="font-weight:400;font-size:10px;color:var(--t3)">(${(r.timeline||[]).length} events)</span></h3>
    <datalist id="rvEvLb">${rvEvH}</datalist>
    <div class="tl-add">
      <div class="fg" style="flex:0 0 105px"><label class="fl">Date</label><input type="date" class="fi" id="evD" value="${td()}"></div>
      <div class="fg" style="flex:1"><label class="fl">Event</label><input class="fi" id="evL" list="rvEvLb" placeholder="Select or enter..."></div>
      <div class="fg" style="flex:1"><label class="fl">Note</label><input class="fi" id="evN" placeholder="Optional"></div>
      <button class="bsav rev" id="evA" style="padding:7px 10px;flex-shrink:0">+</button>
    </div>
    ${tl.length?`<div class="tl-list">${tlH}</div>`:'<div style="font-size:11px;color:var(--t3)">No events</div>'}
    </div>
    </div><div class="mf">${!isN?'<button class="bdel" id="fDl">🗑 Delete</button>':'<div></div>'}<div style="display:flex;gap:6px"><button class="bcan" id="fCa">Cancel</button><button class="bsav rev" id="fSv">${isN?'Add':'Save'}</button></div></div></div>`;

    ov.onclick=e=>{if(e.target===ov){editing=null;rmF();render()}};
    document.getElementById('fX').onclick=document.getElementById('fCa').onclick=()=>{editing=null;rmF();render()};

    document.getElementById('evA').onclick=()=>{
      const l=document.getElementById('evL').value.trim();if(!l)return;
      if(!r.timeline)r.timeline=[];
      r.timeline.push({id:uid(),date:document.getElementById('evD').value,label:l,color:'#059669',note:document.getElementById('evN').value.trim()});
      syncR();rf();
    };
    document.querySelectorAll('.del-ev').forEach(b=>{b.onclick=()=>{r.timeline=r.timeline.filter(ev=>ev.id!==b.dataset.evid);syncR();rf()}});

    document.getElementById('fSv').onclick=()=>{
      syncR();
      if(!r.journal.trim()){toast('Please enter a journal name','error');return}
      r.status=r.decision?'completed':'pending';

      const wkVal=document.getElementById('rvWk').value;
      if(wkVal==='__new__'){r.reviewWorkId=uid()}
      else if(wkVal){r.reviewWorkId=wkVal}
      else{r.reviewWorkId=''}

      r.id=r.id||uid();
      if(isN)reviews.push(r);else{const idx=reviews.findIndex(x=>x.id===r.id);if(idx>=0)reviews[idx]=r}
      editing=null;rmF();persist();
    };
    const dl=document.getElementById('fDl');if(dl)dl.onclick=()=>{if(confirm('Delete this review?')){reviews=reviews.filter(x=>x.id!==r.id);editing=null;rmF();persist()}};

    function syncR(){
      r.journal=document.getElementById('rvJ')?.value||'';
      r.paperTitle=document.getElementById('rvT')?.value||'';
      r.inviteDate=document.getElementById('rvI')?.value||'';
      r.dueDate=document.getElementById('rvD')?.value||'';
      r.round=parseInt(document.getElementById('rvR')?.value||'1');
      r.decision=document.getElementById('rvDec')?.value||'';
      r.link=document.getElementById('rvL')?.value||'';
      r.notes=document.getElementById('rvN')?.value||'';
      const accUser=document.getElementById('rvAccUser');
      const accPass=document.getElementById('rvAccPass');
      if(accUser&&accPass){
        if(!r.account)r.account={};
        r.account.username=accUser.value;
        r.account.password=accPass.value;
      }
    }
  }
  rf();setTimeout(()=>document.getElementById('rvJ')?.focus(),80);
}

function toggleFormPwd(inputId){
  const input=document.getElementById(inputId);
  const btn=input.nextElementSibling;
  if(input.type==='password'){
    input.type='text';
    btn.textContent='🙈';
  }else{
    input.type='password';
    btn.textContent='👁️';
  }
}

function rmF(){const m=document.getElementById('f-ov');if(m)m.remove()}

function renderBoot(message='Checking secure access…'){
  document.getElementById('app').innerHTML=`<div class="boot-state"><div class="boot-card"><div class="big">💾</div><h2>Loading Data</h2><p>${esc(message)}</p></div></div>`;
}
function renderLogin(message=''){
  papers=[];reviews=[];labels=[...DEF_LABELS];serverRevision=0;
  document.getElementById('app').innerHTML=`<div class="boot-state"><form class="boot-card login-card" id="loginForm"><div class="login-mark">🔐</div><h2>Protected Submission Tracker</h2><p class="login-copy">Enter the application password to open the private tracker.</p><label for="loginPassword">Password</label><input id="loginPassword" type="password" autocomplete="current-password" required autofocus><button id="loginButton" type="submit">Unlock</button><p class="login-error" id="loginError">${esc(message)}</p><p class="login-foot">The password is sent only to the secure API and is never stored by this page.</p></form></div>`;
  const form=document.getElementById('loginForm');
  const input=document.getElementById('loginPassword');
  const button=document.getElementById('loginButton');
  const errorBox=document.getElementById('loginError');
  form.onsubmit=async event=>{
    event.preventDefault();
    button.disabled=true;button.textContent='Checking…';errorBox.textContent='';
    const password=input.value;input.value='';
    try{
      const response=await fetch(apiEndpoint('/api/auth/login'),{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});
      const detail=await response.json().catch(()=>({}));
      if(!response.ok)throw new Error(detail.error||`Authentication returned HTTP ${response.status}`);
      csrfToken=detail.csrfToken||'';
      renderBoot('Opening private data…');
      await loadL();render();
    }catch(error){
      errorBox.textContent=error.message||String(error);
      button.disabled=false;button.textContent='Unlock';input.focus();
    }
  };
}
async function getAuthStatus(){
  const response=await fetch(apiEndpoint('/api/auth/status'),{cache:'no-store',credentials:'include'});
  if(!response.ok)throw new Error(`Authentication service returned HTTP ${response.status}`);
  return response.json();
}
async function logout(){
  try{await fetch(apiEndpoint('/api/auth/logout'),{method:'POST',credentials:'include'})}catch{}
  csrfToken='';storageState='loading';storageMessage='Signed out';
  renderLogin();
}
function renderBackendError(error){
  const help=IS_LOCAL_BACKEND?'<p>Run the following command in the project directory, then refresh the page:</p><code>python server.py</code>':'<p>The secure remote API is unavailable. Check the deployment, then refresh this page.</p>';
  document.getElementById('app').innerHTML=`<div class="boot-state"><div class="boot-card"><div class="big">⚠️</div><h2>Cannot Connect to the Secure Backend</h2><p>${esc(error.message||String(error))}</p>${help}</div></div>`;
}
async function init(){
  renderBoot();
  try{
    const auth=await getAuthStatus();
    if(!auth.authenticated){renderLogin();return}
    csrfToken=auth.csrfToken||'';
    await loadL();render();
  }catch(error){
    storageState='error';storageMessage=error.message;
    if(error.status===401)renderLogin();else renderBackendError(error);
  }
}
window.addEventListener('beforeunload',event=>{
  if(storageState==='saving'){event.preventDefault();event.returnValue=''}
});
init();
</script>
</body>
</html>
