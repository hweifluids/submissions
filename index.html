<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Submission Tracker">
<meta name="submonitor-api-base" content="https://api.fluids.ac">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://api.fluids.ac; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'">
<title>Submission & Peer Review Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📑</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
<style>
:root{--bg:#f5f3f0;--card:#fff;--border:#e4e0db;--text:#1c1917;--t2:#57534e;--t3:#a8a29e;--ibg:#fafaf9;--ac:#7c3aed;--ac-rev:#059669;--r:10px;--sh:0 1px 3px rgba(28,25,23,.06),0 6px 16px rgba(28,25,23,.04);--shl:0 8px 40px rgba(28,25,23,.12)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;zoom:1.25;overflow-x:hidden}
.header{background:linear-gradient(160deg,#1c1917 0%,#292524 60%,#44403c 100%);color:#fff;padding:26px 20px 20px;position:relative;overflow:hidden}
.header::before{content:'';position:absolute;top:-40%;right:-10%;width:300px;height:300px;background:radial-gradient(circle,rgba(124,58,237,.25) 0%,transparent 70%);pointer-events:none}
.hi{width:100%;max-width:none;margin:0 auto;position:relative;z-index:1}
.ha{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.header h1{font-size:21px;font-weight:900;letter-spacing:-.5px;display:flex;align-items:center;gap:8px}
.header p{margin:3px 0 0;font-size:11.5px;opacity:.5}
.hb{display:flex;gap:7px;flex-shrink:0;align-items:center;flex-wrap:wrap}
.hbtn{padding:9px 18px;border-radius:10px;border:1.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;font-size:12.5px;font-weight:700;cursor:pointer;backdrop-filter:blur(8px);transition:all .2s;font-family:inherit;display:flex;align-items:center;gap:5px}
.hbtn:hover{background:rgba(255,255,255,.18)}
.hbtn.warn{border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.12)}
.hbtn.rev{background:rgba(5,150,105,.2)}
.storage-status{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:4px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);font-size:10.5px;font-weight:700;color:rgba(255,255,255,.78)}
.storage-status .dot{width:7px;height:7px;border-radius:50%;background:#94a3b8;box-shadow:0 0 0 3px rgba(148,163,184,.14)}
.storage-status.saving .dot,.storage-status.loading .dot{background:#fbbf24;box-shadow:0 0 0 3px rgba(251,191,36,.16);animation:pulse 1s ease-in-out infinite}
.storage-status.saved .dot{background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.14)}
.storage-status.error{color:#fecaca;border-color:rgba(248,113,113,.35);background:rgba(127,29,29,.25)}
.storage-status.error .dot{background:#f87171;box-shadow:0 0 0 3px rgba(248,113,113,.14)}
.boot-state{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
.boot-card{width:min(560px,100%);padding:28px;border-radius:14px;background:var(--card);border:1px solid var(--border);box-shadow:var(--sh);text-align:center}
.boot-card .big{font-size:36px;margin-bottom:12px}.boot-card h2{font-size:18px;margin-bottom:8px}.boot-card p{font-size:12px;color:var(--t2);line-height:1.7}.boot-card code{display:inline-block;margin-top:12px;padding:7px 10px;border-radius:7px;background:var(--ibg);border:1px solid var(--border);font-size:12px;color:var(--t1)}
.login-card{width:min(390px,100%);text-align:left}
.login-card .login-mark{text-align:center;font-size:38px;margin-bottom:10px}
.login-card h2{text-align:center;font-size:19px;margin-bottom:6px}
.login-card .login-copy{text-align:center;margin-bottom:18px}
.login-card label{display:block;font-size:10px;font-weight:800;color:var(--t2);letter-spacing:.35px;text-transform:uppercase;margin-bottom:5px}
.login-card input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--ibg);font:inherit;font-size:13px;color:var(--text);outline:none}
.login-card input:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(124,58,237,.1)}
.login-card button{width:100%;margin-top:10px;padding:10px 14px;border:0;border-radius:8px;background:var(--ac);color:#fff;font:inherit;font-size:12.5px;font-weight:800;cursor:pointer}
.login-card button:disabled{opacity:.55;cursor:wait}
.login-error{min-height:18px;margin-top:9px;color:#dc2626!important;text-align:center;font-weight:600}
.login-foot{text-align:center;margin-top:12px!important;color:var(--t3)!important;font-size:10.5px!important}
@keyframes pulse{50%{opacity:.45}}
.sr{display:flex;gap:5px;flex-wrap:wrap;margin-top:12px}
.sc{padding:3px 9px;border-radius:7px;background:rgba(255,255,255,.08);font-size:11px;font-weight:500;display:flex;align-items:center;gap:4px;white-space:nowrap}
.sc b{background:rgba(255,255,255,.15);padding:1px 6px;border-radius:8px;font-size:10px;font-weight:800}
.tabs{width:100%;max-width:none;margin:0 auto;padding:12px 20px 0;display:flex;gap:4px;border-bottom:1px solid var(--border);align-items:center}
.tab{padding:7px 14px;border:none;background:none;font-size:13px;font-weight:600;color:var(--t3);cursor:pointer;font-family:inherit;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s}
.tab.ac{color:var(--ac);border-bottom-color:var(--ac)}
.tab.ac-rev{color:var(--ac-rev);border-bottom-color:var(--ac-rev)}
.tab:hover{color:var(--t2)}
.tab-main{font-size:14px;padding:8px 16px} /* Primary tabs */
.tb{width:100%;max-width:none;margin:0 auto;padding:10px 20px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sbox{flex:1;min-width:140px;position:relative}
.sbox .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px;opacity:.35;pointer-events:none}
.sbox input{width:100%;padding:7px 10px 7px 30px;border-radius:var(--r);border:1px solid var(--border);background:var(--card);font-size:12.5px;color:var(--text);outline:none;font-family:inherit}
.sbox input:focus{border-color:var(--ac)}
.gtog{display:flex;border-radius:var(--r);border:1px solid var(--border);overflow:hidden}
.gtog button{padding:6px 11px;border:none;background:var(--card);color:var(--t2);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}
.gtog button.ac{background:var(--ac);color:#fff}
.gtog button.ac-rev{background:var(--ac-rev);color:#fff}
.gtog button:not(:last-child){border-right:1px solid var(--border)}
.ebar{width:100%;max-width:none;margin:0 auto;padding:0 20px;display:flex;justify-content:flex-end;gap:5px;margin-top:7px}
.ebtn{padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--t2);font-size:10.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.ebtn:hover{border-color:var(--ac);color:var(--ac)}
.ct{width:100%;max-width:none;margin:0 auto;padding:12px 20px 60px}
.ct.dashboard-limited{max-width:920px}
.gsec{margin-bottom:24px;animation:fu .3s ease both}
@keyframes fu{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.gh{display:flex;align-items:center;gap:7px;margin-bottom:9px;padding-bottom:6px;border-bottom:2px solid var(--border)}
.gh .em{font-size:15px}.gh .lb{font-size:13px;font-weight:700}
.gh .cn{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:10px}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:9px}
.pc{background:var(--card);border-radius:11px;border:1px solid var(--border);padding:13px 15px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;display:flex;flex-direction:column}
.card-body{flex:1;min-width:0}
.pc:hover{box-shadow:var(--sh);transform:translateY(-1px)}
.pc.dimmed{opacity:.6;background:#f8f9fa;order:999}
.pc .ab{position:absolute;top:0;left:0;right:0;height:3px;border-radius:11px 11px 0 0}
.ctop{display:flex;justify-content:space-between;align-items:flex-start;gap:7px;margin-bottom:4px}
.ctt{font-size:13px;font-weight:700;line-height:1.35;flex:1;word-break:break-word}
.rtag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;white-space:nowrap;flex-shrink:0}
.cjn{font-size:11.5px;color:var(--t2);font-style:italic;margin-bottom:7px}
.sbdg{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;white-space:nowrap;flex-shrink:0}
.cbot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:5px}
.qbs{display:flex;gap:3px;flex-wrap:wrap}
.qb{background:none;border:1px solid var(--border);border-radius:5px;padding:2px 4px;font-size:10px;cursor:pointer;opacity:.35;transition:all .15s;line-height:1}
.qb:hover{opacity:1}
.clk{display:inline-flex;align-items:center;gap:3px;margin-top:6px;font-size:10.5px;color:var(--ac);text-decoration:none;opacity:.7}
.clk:hover{opacity:1}
.cmeta{font-size:10px;color:var(--t3);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cmeta .urgent{color:#ef4444;font-weight:600}
.ctlm{margin-top:7px;padding-top:7px;border-top:1px dashed var(--border)}
.ctlm .ev{font-size:10px;color:var(--t3);display:flex;align-items:center;gap:4px;padding:1px 0}
.ctlm .ev .dot{width:4px;height:4px;border-radius:50%;flex-shrink:0}
.pri{display:inline-flex;align-items:center;gap:1px;font-size:9px}
.pri .star{color:#f59e0b;cursor:pointer}
.pri .star.off{color:var(--border)}
.hist-chain{margin-top:6px;display:flex;align-items:center;gap:3px;flex-wrap:wrap}
.hist-link{font-size:9.5px;padding:1px 6px;border-radius:4px;background:#f1f5f9;color:#475569;border:1px solid #e2e8f0;text-decoration:none;cursor:pointer;display:flex;align-items:center;gap:2px;transition:all .15s}
.hist-link:hover{border-color:var(--ac);color:var(--ac)}
.hist-link.current{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:700}
.hist-arrow{color:var(--t3);font-size:9px}
.round-badge{position:absolute;top:8px;right:10px;font-size:9px;font-weight:800;padding:1px 6px;border-radius:4px;background:rgba(124,58,237,.1);color:var(--ac)}
.tags-row{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px}
.tag-sm{font-size:9.5px;padding:1px 5px;border-radius:3px;background:#f1f5f9;color:#475569;border:1px solid #e2e8f0}
.ep{text-align:center;padding:50px 20px;color:var(--t3)}
.ep .big{font-size:44px;margin-bottom:10px}
.ep .mg{font-size:13.5px;font-weight:600;margin-bottom:4px;color:var(--t2)}
.ep .su{font-size:12px}
.ep .ebtn{margin-top:16px;display:inline-flex;font-size:12px;padding:8px 16px}
.mo{position:fixed;inset:0;background:rgba(28,25,23,.5);display:flex;align-items:flex-start;justify-content:center;z-index:999;backdrop-filter:blur(4px);padding:10px;overflow-y:auto;animation:fi .2s ease}
@keyframes fi{from{opacity:0}to{opacity:1}}
.md{background:var(--card);border-radius:14px;width:100%;max-width:580px;max-height:calc(80vh - 20px);max-height:calc(80dvh - 20px);margin-block:auto;overflow:auto;padding:22px;box-shadow:var(--shl);animation:su .25s ease}
@keyframes su{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.mh h2{font-size:16px;font-weight:800}
.xbtn{background:none;border:none;font-size:18px;cursor:pointer;color:var(--t3);padding:4px}
.fg{margin-bottom:11px}
.fl{display:block;font-size:10px;font-weight:700;color:var(--t2);margin-bottom:3px;text-transform:uppercase;letter-spacing:.3px}
.fi{width:100%;padding:7px 10px;border-radius:7px;border:1px solid var(--border);background:var(--ibg);color:var(--text);font-size:12.5px;outline:none;font-family:inherit;transition:border .15s}
.fi:focus{border-color:var(--ac)}
.fi.rev:focus{border-color:var(--ac-rev)}
textarea.fi{resize:vertical;min-height:42px}
.fr{display:flex;gap:10px}
.fr>*{flex:1}
.fr .nw{flex:0 0 140px}
.fr .nw2{flex:0 0 100px}
.so{display:flex;gap:4px;flex-wrap:wrap}
.sop{padding:5px 9px;border-radius:7px;border:1px solid var(--border);background:transparent;font-size:11px;font-weight:500;cursor:pointer;transition:all .15s;font-family:inherit;display:flex;align-items:center;gap:3px;color:var(--t2)}
.sop.ac{border-width:2px;font-weight:700}
.mf{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
.bdel{padding:6px 12px;border-radius:7px;border:1px solid #fca5a5;background:#fef2f2;color:#dc2626;font-size:11.5px;font-weight:600;cursor:pointer;font-family:inherit}
.bcan{padding:6px 14px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--t2);font-size:12px;cursor:pointer;font-family:inherit}
.bsav{padding:6px 18px;border-radius:7px;border:none;background:var(--ac);color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 2px 6px rgba(124,58,237,.25)}
.bsav:hover{background:#6d28d9}
.bsav.rev{background:var(--ac-rev);box-shadow:0 2px 6px rgba(5,150,105,.25)}
.bsav.rev:hover{background:#047857}
.tls{margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
.tls h3{font-size:12.5px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.tl-add{display:flex;gap:6px;margin-bottom:10px;align-items:flex-end;flex-wrap:wrap}
.tl-add .fg{margin-bottom:0}
.tl-list{position:relative;padding-left:16px}
.tl-list::before{content:'';position:absolute;left:4px;top:3px;bottom:3px;width:2px;background:var(--border);border-radius:1px}
.tl-ev{position:relative;padding:4px 0 8px 10px;font-size:11.5px}
.tl-ev .dot{position:absolute;left:-16px;top:7px;width:9px;height:9px;border-radius:50%;border:2px solid var(--card)}
.tl-ev .date{color:var(--t3);font-size:10px;margin-bottom:1px}
.tl-ev .label{font-weight:600;color:var(--text)}
.tl-ev .note{color:var(--t2);font-size:10.5px;margin-top:1px}
.tl-ev .del-ev{position:absolute;right:0;top:4px;background:none;border:none;font-size:10px;color:var(--t3);cursor:pointer;opacity:0;transition:opacity .15s}
.tl-ev:hover .del-ev{opacity:1}
.hist-sec{margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
.hist-sec h3{font-size:12.5px;font-weight:700;margin-bottom:8px}
.hist-item{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--ibg);border:1px solid var(--border);border-radius:7px;margin-bottom:5px;font-size:11.5px}
.hist-item .jn{font-weight:600;flex-shrink:0}
.hist-item .st{font-size:10px}
.hist-item .sep{color:var(--t3)}
.hist-item .go{margin-left:auto;font-size:10px;color:var(--ac);cursor:pointer;flex-shrink:0}
.cs-row{display:flex;gap:5px;flex-wrap:wrap}
.cs-tag{padding:2px 7px;border-radius:5px;font-size:10.5px;font-weight:600;background:var(--ibg);border:1px solid var(--border);color:var(--t2);display:flex;align-items:center;gap:3px}
.cs-tag .x{cursor:pointer;opacity:.5;font-size:9px}
.cs-tag .x:hover{opacity:1}
.cs-add{padding:2px 7px;border-radius:5px;font-size:10.5px;border:1px dashed var(--border);background:none;color:var(--t3);outline:none;font-family:inherit;width:100px}
.cs-add:focus{border-color:var(--ac);color:var(--text)}
.det-hd{padding:18px;background:var(--card);border-radius:11px;border:1px solid var(--border);margin-bottom:14px}
.det-hd .bk{font-size:13px;color:var(--ac);cursor:pointer;display:inline-flex;align-items:center;gap:3px;margin-bottom:8px;font-weight:600;border:1px solid var(--ac);padding:4px 12px;border-radius:6px;background:rgba(124,58,237,.05)}
.det-hd .bk:hover{background:rgba(124,58,237,.1)}
.det-hd h2{font-size:17px;font-weight:800;margin-bottom:4px}
.det-hd .meta{font-size:12px;color:var(--t2);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.det-tl{background:var(--card);border-radius:11px;border:1px solid var(--border);padding:18px}
.det-tl h3{font-size:13px;font-weight:700;margin-bottom:12px}
.ftl{position:relative;padding-left:22px}
.ftl::before{content:'';position:absolute;left:7px;top:5px;bottom:5px;width:2px;background:linear-gradient(to bottom,var(--ac),var(--border));border-radius:1px}
.ftl .ev{position:relative;padding:6px 0 14px 14px}
.ftl .ev .dot{position:absolute;left:-22px;top:9px;width:12px;height:12px;border-radius:50%;border:2.5px solid var(--card);box-shadow:0 0 0 1px var(--border)}
.ftl .ev .date{font-size:10.5px;color:var(--t3);margin-bottom:2px;font-weight:500}
.ftl .ev .label{font-size:13px;font-weight:700}
.ftl .ev .note{font-size:11.5px;color:var(--t2);margin-top:2px;line-height:1.4}
.ftl .ev .dur{font-size:9.5px;color:var(--t3);margin-top:3px;font-style:italic}

.dash{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-bottom:18px}
.dash-c{background:var(--card);border-radius:9px;border:1px solid var(--border);padding:10px 8px;text-align:center}
.dash-c .num{font-size:22px;font-weight:900;color:var(--ac);line-height:1}
.dash-c .num.rev{color:var(--ac-rev)}
.dash-c .lbl{font-size:10px;color:var(--t2);margin-top:3px;font-weight:600;white-space:nowrap}
.hist-view{background:var(--card);border-radius:11px;border:1px solid var(--border);padding:18px;margin-bottom:14px}
.hist-view h3{font-size:14px;font-weight:700;margin-bottom:12px}
.hist-chain-full{display:flex;flex-direction:column;gap:8px}
.hist-chain-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--ibg);cursor:pointer;transition:all .15s}
.hist-chain-item:hover{border-color:var(--ac);box-shadow:var(--sh)}
.hist-chain-item .round{font-size:11px;font-weight:800;color:var(--ac);background:rgba(124,58,237,.1);padding:2px 8px;border-radius:5px;flex-shrink:0}
.hist-chain-item .info{flex:1}
.hist-chain-item .info .jn{font-size:12.5px;font-weight:700}
.hist-chain-item .info .tt{font-size:11px;color:var(--t2);margin-top:1px}
.hist-chain-item .info .dates{font-size:10px;color:var(--t3);margin-top:2px}
.hist-chain-item .stb{flex-shrink:0}
.backup-bar{width:100%;max-width:none;margin:8px auto 0;padding:0 20px}
.backup-banner{padding:9px 14px;border-radius:8px;background:#fffbeb;border:1px solid #fde68a;display:flex;align-items:center;gap:8px;font-size:11.5px;color:#92400e;font-weight:500}
.backup-banner b{font-weight:700}
.backup-banner .bbtn{margin-left:auto;padding:4px 12px;border-radius:6px;border:1px solid #fbbf24;background:#fef3c7;color:#92400e;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;flex-shrink:0}
.backup-banner .dismiss{cursor:pointer;opacity:.5;font-size:12px;flex-shrink:0}
.backup-banner .dismiss:hover{opacity:1}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:9px 18px;border-radius:9px;font-size:12.5px;font-weight:600;font-family:inherit;z-index:9999;animation:ti .3s ease;box-shadow:0 4px 16px rgba(0,0,0,.12);white-space:nowrap;background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
.toast.error{background:#fee2e2;color:#991b1b;border-color:#fecaca}
@keyframes ti{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.cact{display:flex;gap:4px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border);justify-content:space-between;align-items:center}
.cact-left{display:flex;gap:4px}
.cact-btn{font-size:10px;padding:3px 8px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--t2);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:3px}
.cact-btn:hover{background:var(--ibg);border-color:var(--ac);color:var(--ac)}
.cact-btn.rev:hover{border-color:var(--ac-rev);color:var(--ac-rev)}
.cact-del{color:#dc2626;border-color:#fca5a5;background:#fef2f2}
.cact-del:hover{background:#fee2e2;border-color:#dc2626;color:#dc2626}
/* Account display */
.acc-display{margin-top:6px;padding:6px 8px;background:var(--ibg);border-radius:6px;font-size:11px;border:1px solid var(--border)}
.acc-line{display:flex;align-items:center;gap:6px;margin:2px 0}
.acc-label{color:var(--t3);min-width:36px}
.acc-value{font-family:monospace;letter-spacing:0.5px}
.acc-eye{cursor:pointer;opacity:.5;transition:opacity .2s}

/* Filter controls */
.filt-console{background:var(--card);border-radius:11px;border:1px solid var(--border);padding:14px;margin:0 0 16px 0;display:flex;gap:12px;flex-wrap:wrap;align-items:end;max-width:100%}
.filt-grp{flex:1;min-width:140px;max-width:200px}
.filt-grp label{font-size:10px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px;display:block}
.filt-grp select,.filt-grp input{width:100%;padding:6px 8px;border-radius:6px;border:1px solid var(--border);font-family:inherit;font-size:12px;background:var(--ibg)}
.chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:20px}
.chart-box{background:var(--card);border-radius:11px;border:1px solid var(--border);padding:16px}
.chart-box h4{font-size:12px;font-weight:700;color:var(--t2);margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px}
.chart-container{position:relative;height:220px}
/* Large charts */
.chart-large-box{background:var(--card);border-radius:11px;border:1px solid var(--border);padding:16px;margin-top:16px}
.chart-large-box h4{font-size:12px;font-weight:700;color:var(--t2);margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px}
.chart-container-large{position:relative;height:350px;display:flex;gap:16px}
.chart-area{flex:1;min-width:0;position:relative}
.chart-area canvas{max-width:100%!important}
.legend-area{width:180px;flex:0 0 180px;min-width:0;max-height:350px;overflow-y:auto;border-left:1px solid var(--border);padding-left:12px}
.legend-item{display:flex;align-items:center;gap:6px;margin-bottom:6px;font-size:11px;cursor:pointer;padding:2px 4px;border-radius:4px;transition:all .2s}
.legend-item:hover{background:var(--ibg)}
.legend-item.hidden{opacity:.3}
.legend-color{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.legend-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Multi-select mode */
.select-mode-bar{position:sticky;top:0;z-index:100;background:var(--card);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;justify-content:space-between;align-items:center;margin:0 -20px 10px}
.select-count{font-size:13px;font-weight:600}
.select-actions{display:flex;gap:8px}
.pc-select{position:absolute;top:8px;left:8px;z-index:10}
.pc-checkbox{width:18px;height:18px;cursor:pointer;accent-color:var(--ac)}
/* Account modal */
.acc-modal{background:var(--card);border-radius:12px;padding:20px;max-width:400px;width:90%;margin:auto}
.acc-row{margin-bottom:12px}
.acc-row label{font-size:11px;font-weight:600;color:var(--t2);display:block;margin-bottom:4px}
.acc-input-wrap{position:relative;display:flex;align-items:center}
.acc-input-wrap input{flex:1;padding:8px 10px;border-radius:6px;border:1px solid var(--border);font-family:inherit;font-size:12.5px;padding-right:32px}
.acc-eye-btn{position:absolute;right:8px;background:none;border:none;cursor:pointer;font-size:14px;color:var(--t3);padding:2px}
.acc-btns{display:flex;gap:8px;margin-top:16px}
.acc-btns button{flex:1;padding:8px;border-radius:6px;border:1px solid var(--border);background:var(--ibg);cursor:pointer;font-size:12px;font-weight:600}
.acc-btns button.primary{background:var(--ac);color:#fff;border-color:var(--ac)}
.acc-btns button.primary.rev{background:var(--ac-rev);border-color:var(--ac-rev)}

.card-info-stack{display:flex;flex-direction:column;align-items:stretch;gap:6px;width:100%;margin-bottom:6px}
.card-info-stack .cjn{width:100%;margin-bottom:0}
.tag-stack{display:flex;align-items:center;justify-content:flex-start;flex-wrap:wrap;gap:4px;width:100%}
@media(max-width:520px){
  .header{padding:20px 14px 16px}.header h1{font-size:18px}
  .tabs,.tb,.ct,.ebar,.backup-bar{padding-left:14px;padding-right:14px}
  .cg{grid-template-columns:1fr}.fr{flex-direction:column;gap:10px}
  .fr .nw,.fr .nw2{flex:1}.md{padding:18px 14px}
  .hbtn{padding:7px 12px;font-size:11px}.qbs{display:none}
  .dash{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
  .tl-add{flex-direction:column}
  .filt-console{flex-direction:column}
  .filt-grp{max-width:100%}
  .chart-container-large{flex-direction:column;height:auto}
  .legend-area{width:100%;border-left:none;border-top:1px solid var(--border);padding-left:0;padding-top:12px;max-height:200px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>

// Register the Chart.js plugin.
Chart.register(ChartDataLabels);

const ST=[{key:'preparing',label:'Preparing',emoji:'📝',color:'#6366f1'},{key:'with_editor',label:'With Editor',emoji:'📨',color:'#0ea5e9'},{key:'under_review',label:'Under Review',emoji:'🔬',color:'#f59e0b'},{key:'revision',label:'In revision',emoji:'🔧',color:'#a855f7'},{key:'revision_under_review',label:'Revision under review',emoji:'🔁',color:'#8b5cf6'},{key:'accepted',label:'Accepted',emoji:'🎉',color:'#22c55e'},{key:'rejected',label:'Rejected',emoji:'❌',color:'#ef4444'},{key:'withdrawn',label:'Withdrawn',emoji:'↩️',color:'#94a3b8'}];
const RL=[{key:'first',label:'First Author',bg:'#fef3c7',fg:'#92400e',bd:'#fde68a'},{key:'corresponding',label:'Corresponding Author',bg:'#ede9fe',fg:'#5b21b6',bd:'#ddd6fe'},{key:'co_first',label:'Co-first Author',bg:'#fce7f3',fg:'#9d174d',bd:'#fbcfe8'},{key:'co_corresponding',label:'Co-corresponding Author',bg:'#dbeafe',fg:'#1e40af',bd:'#bfdbfe'},{key:'other',label:'Co-author',bg:'#f1f5f9',fg:'#475569',bd:'#e2e8f0'}];
const RV_ST=[{key:'pending',label:'Pending',emoji:'⏳',color:'#f59e0b'},{key:'completed',label:'Completed',emoji:'✅',color:'#22c55e'}];
const RV_DEC=[{key:'',label:'Undecided',emoji:'🤔',color:'#9ca3af'},{key:'accept',label:'Accept',emoji:'🎉',color:'#22c55e'},{key:'minor',label:'Minor Revision',emoji:'🔧',color:'#3b82f6'},{key:'major',label:'Major Revision',emoji:'🔨',color:'#f59e0b'},{key:'reject',label:'Reject',emoji:'❌',color:'#ef4444'}];
// Preset peer-review events.
const RV_EVENTS=['Invitation Received','Invitation Accepted','Review Started','Review Submitted','Re-review','Completed'];
const DEF_LABELS=['Submitted','With Editor','Correspondence Letter','Under Review','Review Complete','Minor Revision','Major Revision','Revision Requested','Revision Submitted','Accepted','Rejected','Withdrawn','Decision Pending','Proof Received','Published'];

const normalizePaperStatus=k=>k==='submitted'?'with_editor':k;
const normalizePaperRecord=p=>({...p,status:normalizePaperStatus(p.status)});
const gs=k=>ST.find(s=>s.key===normalizePaperStatus(k))||ST[0];
const statusCategory=k=>normalizePaperStatus(k)==='revision_under_review'?'under_review':normalizePaperStatus(k);
const countTimelineEvents=(items,eventLabel)=>items.reduce((total,item)=>total+(item.timeline||[]).filter(event=>String(event.label||'').trim().toLowerCase()===eventLabel.toLowerCase()).length,0);
function countTimelineEventsByMonth(items,eventLabel){
  const counts={};
  const target=eventLabel.toLowerCase();
  items.forEach(item=>{
    (item.timeline||[]).forEach(event=>{
      if(String(event.label||'').trim().toLowerCase()!==target)return;
      const month=String(event.date||'').slice(0,7);
      if(!/^\d{4}-\d{2}$/.test(month))return;
      counts[month]=(counts[month]||0)+1;
    });
  });
  return counts;
}
const gr=k=>RL.find(r=>r.key===k)||RL[4];
const grv=k=>RV_ST.find(s=>s.key===k)||RV_ST[0];
const gdec=k=>RV_DEC.find(d=>d.key===(k||''))||RV_DEC[0];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML};
const fD=d=>{if(!d)return'';const p=d.split('-');return p.length===3?p[0]+'/'+p[1]+'/'+p[2]:d};
const statusDisplayLabel=p=>p.status==='revision'&&p.deadline?`${gs(p.status).label} (${fD(p.deadline)})`:gs(p.status).label;
const roleDisplayLabel=p=>p.role==='other'&&Number(p.authorPosition)>0?`${gr(p.role).label} (${Math.trunc(Number(p.authorPosition))})`:gr(p.role).label;
const dB=(a,b)=>{if(!a||!b)return 0;return Math.round((new Date(b)-new Date(a))/86400000)};
const td=()=>new Date().toISOString().slice(0,10);

const LOCAL_HOSTS=new Set(['127.0.0.1','localhost','::1','[::1]']);
const IS_LOCAL_BACKEND=LOCAL_HOSTS.has(window.location.hostname);
const REMOTE_API_BASE=(document.querySelector('meta[name="submonitor-api-base"]')?.content||'').replace(/\/$/,'');
const API_BASE=IS_LOCAL_BACKEND?'':REMOTE_API_BASE;
const apiEndpoint=path=>`${API_BASE}${path}`;
const DATA_API=apiEndpoint('/api/data');
const DATA_VERSION='2026V4';

let papers=[], reviews=[];
let mainTab='papers';
let groupBy='status', search='', editing=null, view='list', detailId=null;
let labels=[...DEF_LABELS];
let chartInstance1=null, chartInstance2=null, chartInstance3=null;
let filterYear='', filterMonth='', filterJournal='';
let selectMode=false, selectedIds=new Set();
let searchTimeout=null;
let hiddenDatasets=new Set(); // Controls the large-chart legend.
let storageState='loading';
let storageMessage='Connecting to the local backend';
let saveTail=Promise.resolve();
let saveRevision=0;
let serverRevision=0;
let csrfToken='';

function storageStatusHTML(){
  const text={loading:'Connecting to backend',saving:'Writing data file',saved:'Connected',error:'Backend save failed'}[storageState]||'Unknown storage status';
  return `<span class="storage-status ${storageState}" id="storageStatus" title="${esc(storageMessage)}"><span class="dot"></span><span>${text}</span></span>`;
}
function setStorageState(state,message=''){
  storageState=state;
  storageMessage=message;
  const el=document.getElementById('storageStatus');
  if(!el)return;
  const text={loading:'Connecting to backend',saving:'Writing data file',saved:'Connected',error:'Backend save failed'}[state]||'Unknown storage status';
  el.className=`storage-status ${state}`;
  el.title=message;
  const label=el.querySelector('span:last-child');if(label)label.textContent=text;
}
function legacyLocalData(){
  try{
    const oldPapers=JSON.parse(localStorage.getItem('pt_p2')||'[]');
    const oldReviews=JSON.parse(localStorage.getItem('pt_rv')||'[]');
    const oldLabels=JSON.parse(localStorage.getItem('pt_lb')||'null');
    return{
      papers:Array.isArray(oldPapers)?oldPapers:[],
      reviews:Array.isArray(oldReviews)?oldReviews:[],
      labels:Array.isArray(oldLabels)?oldLabels:[...DEF_LABELS]
    };
  }catch{return{papers:[],reviews:[],labels:[...DEF_LABELS]}}
}
async function loadL(){
  setStorageState('loading','Reading data/app-data.json');
  const response=await fetch(DATA_API,{cache:'no-store',credentials:'include'});
  if(!response.ok){
    const detail=await response.json().catch(()=>({}));
    const error=new Error(detail.error||`Backend returned HTTP ${response.status}`);
    error.status=response.status;
    throw error;
  }
  const data=await response.json();
  papers=Array.isArray(data.papers)?data.papers.map(normalizePaperRecord):[];
  reviews=Array.isArray(data.reviews)?data.reviews:[];
  labels=Array.isArray(data.labels)?data.labels:[...DEF_LABELS];
  serverRevision=Number.isInteger(data.dataRevision)?data.dataRevision:0;

  const migrationKey='pt_backend_migrated_v1';
  const legacy=legacyLocalData();
  const backendIsEmpty=papers.length===0&&reviews.length===0;
  const legacyHasData=legacy.papers.length>0||legacy.reviews.length>0;
  if(backendIsEmpty&&legacyHasData&&localStorage.getItem(migrationKey)!=='1'){
    papers=legacy.papers.map(normalizePaperRecord);
    reviews=legacy.reviews;
    labels=legacy.labels;
    await saveL();
    localStorage.setItem(migrationKey,'1');
    toast('Legacy browser data was migrated to the local backend');
  }else{
    localStorage.setItem(migrationKey,'1');
  }
  setStorageState('saved',data.updatedAt?`Backend data updated: ${data.updatedAt}`:'Backend data file connected');
}
function saveL(){
  const snapshot=JSON.parse(JSON.stringify({version:DATA_VERSION,papers,reviews,labels}));
  const revision=++saveRevision;
  setStorageState('saving','Writing data/app-data.json');
  const write=saveTail.then(async()=>{
    const body=JSON.stringify({...snapshot,baseRevision:serverRevision});
    const response=await fetch(DATA_API,{method:'PUT',credentials:'include',headers:{'Content-Type':'application/json','X-CSRF-Token':csrfToken},body});
    if(!response.ok){
      const detail=await response.json().catch(()=>({}));
      const error=new Error(detail.error||`Backend returned HTTP ${response.status}`);
      error.status=response.status;
      throw error;
    }
    const data=await response.json();
    serverRevision=Number.isInteger(data.dataRevision)?data.dataRevision:serverRevision+1;
    return data;
  });
  saveTail=write.catch(()=>{});
  write.then(data=>{
    if(revision===saveRevision)setStorageState('saved',data.updatedAt?`Saved: ${data.updatedAt}`:'Data written to backend');
  }).catch(error=>{
    if(revision===saveRevision)setStorageState('error',error.message);
    if(error.status===409){
      toast('Newer data exists in another tab. Reloading the latest version…','error');
      setTimeout(()=>window.location.reload(),1200);
    }else if(error.status===401){
      csrfToken='';
      renderLogin('Your session expired. Enter the password again.');
    }else{
      toast(`Save failed: ${error.message}`,'error');
    }
  });
  return write;
}
function persist(){const write=saveL();render();return write}
function toast(m,type='success'){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t=document.createElement('div');
  t.className='toast'+(type==='error'?' error':'');
  t.textContent=m;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2500);
}

function getWorkChain(workId){
  if(!workId)return[];
  return papers.filter(p=>p.workId===workId).sort((a,b)=>(a.submittedDate||'').localeCompare(b.submittedDate||''));
}
function getWorkRound(p){
  if(!p.workId)return 0;
  const chain=getWorkChain(p.workId);
  return chain.indexOf(p)+1;
}
function getWorkCount(workId){
  if(!workId)return 0;
  return papers.filter(p=>p.workId===workId).length;
}

function getReviewChain(workId){
  if(!workId)return[];
  return reviews.filter(r=>r.reviewWorkId===workId).sort((a,b)=>(a.inviteDate||'').localeCompare(b.inviteDate||''));
}
function getReviewRound(r){
  if(!r.reviewWorkId)return 0;
  const chain=getReviewChain(r.reviewWorkId);
  return chain.indexOf(r)+1;
}
function getReviewWorkCount(workId){
  if(!workId)return 0;
  return reviews.filter(r=>r.reviewWorkId===workId).length;
}

function getLastBackup(){return localStorage.getItem('pt_lastbk')||''}
function setLastBackup(){localStorage.setItem('pt_lastbk',td())}
function needsBackup(){
  const lb=getLastBackup();
  if(!lb)return papers.length>0||reviews.length>0;
  return dB(lb,td())>=7 && (papers.length>0||reviews.length>0);
}
function dismissBackup(){localStorage.setItem('pt_bkdismiss',td())}
function isDismissed(){return localStorage.getItem('pt_bkdismiss')===td()}

function doExport(){
  const data={papers,reviews,labels,exportDate:td(),version:DATA_VERSION};
  const bl=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(bl);
  a.download='submission-review-backup_'+td()+'.json';a.click();
  setLastBackup();toast('Full backup exported');render();
}
function doImport(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const d=JSON.parse(r.result);
        if(d.papers&&Array.isArray(d.papers)){
          if(confirm(`Import ${d.papers.length} submission records and ${(d.reviews||[]).length} review records?\n\nOK = merge with existing data\nCancel = replace all existing data`)){
            const pids=new Set(papers.map(p=>p.id));
            const rids=new Set(reviews.map(r=>r.id));
            papers=[...papers,...d.papers.filter(x=>!pids.has(x.id)).map(normalizePaperRecord)];
            if(d.reviews) reviews=[...reviews,...d.reviews.filter(x=>!rids.has(x.id))];
          }else{
            papers=d.papers.map(normalizePaperRecord);
            if(d.reviews) reviews=d.reviews;
          }
          if(d.labels) labels=d.labels;
          persist();
          toast('Import completed');
        }else if(Array.isArray(d)){
          if(confirm('A legacy submission-only format was detected. Import it?')){
            papers=d.map(normalizePaperRecord);
            persist();
            toast('Legacy data imported');
          }
        }else{
          alert('Invalid data format');
        }
      }catch{alert('Could not parse the selected file')}
    };
    r.readAsText(f);
  };
  inp.click();
}

function getReviewUrgency(r){
  if(!r.dueDate||r.status==='completed')return null;
  const days=dB(td(),r.dueDate);
  if(days<0)return{urgent:true,text:`Overdue by ${Math.abs(days)} days`,level:3};
  if(days<=3)return{urgent:true,text:`Due in ${days} days`,level:2};
  if(days<=7)return{urgent:false,text:`Due in ${days} days`,level:1};
  return{urgent:false,text:`Due in ${days} days`,level:0};
}
function getDeadline(p){return p.deadline||''}
function daysToDeadline(p){
  const dl=getDeadline(p);
  if(!dl)return null;
  return dB(td(),dl);
}

function render(){
  const app=document.getElementById('app');
  if(detailId){renderDetail();return}

  const isPapers=mainTab==='papers';

  let baseData=isPapers?papers:reviews;

  let filteredData=baseData.filter(item=>{
    let match=true;
    if(filterYear){
      const d=item.submittedDate||item.inviteDate;
      if(d&&d.slice(0,4)!==filterYear)match=false;
    }
    if(filterMonth){
      const d=item.submittedDate||item.inviteDate;
      if(d&&d.slice(5,7)!==filterMonth)match=false;
    }
    if(filterJournal&&item.journal!==filterJournal)match=false;
    return match;
  });

  let fl=filteredData.filter(p=>{
    if(!search)return true;
    const q=search.toLowerCase();
    if(isPapers){
      return(p.title||'').toLowerCase().includes(q)||(p.journal||'').toLowerCase().includes(q)||(p.coAuthors||'').toLowerCase().includes(q)||(p.tags||[]).some(t=>t.toLowerCase().includes(q));
    }else{
      return(p.paperTitle||'').toLowerCase().includes(q)||(p.journal||'').toLowerCase().includes(q);
    }
  });

  let gps=[];
  if(isPapers){
    if(groupBy==='status')ST.filter(s=>s.key!=='revision_under_review').forEach(s=>{const it=fl.filter(p=>statusCategory(p.status)===s.key);if(it.length)gps.push({...s,items:it})});
    else if(groupBy==='role')RL.forEach(r=>{const it=fl.filter(p=>p.role===r.key);if(it.length)gps.push({emoji:'👤',label:r.label,color:'#7c3aed',items:it})});
    else if(groupBy==='journal'){const jm={};fl.forEach(p=>{const j=p.journal||'Unspecified';if(!jm[j])jm[j]=[];jm[j].push(p)});Object.entries(jm).sort((a,b)=>b[1].length-a[1].length).forEach(([j,items])=>gps.push({emoji:'📰',label:j,color:'#0ea5e9',items}));}
    else if(groupBy==='priority'){[3,2,1].forEach(pr=>{const it=fl.filter(p=>(p.priority||1)===pr);if(it.length)gps.push({emoji:pr===3?'🔴':pr===2?'🟡':'⚪',label:['','Normal','Important','Urgent'][pr],color:pr===3?'#ef4444':pr===2?'#f59e0b':'#94a3b8',items:it})})}
    else if(fl.length)gps.push({emoji:'📚',label:'All',color:'#7c3aed',items:fl});
  }else{
    if(groupBy==='status')RV_ST.forEach(s=>{const it=fl.filter(r=>r.status===s.key);if(it.length)gps.push({...s,items:it})});
    else if(groupBy==='decision'){RV_DEC.slice(1).forEach(d=>{const it=fl.filter(r=>r.decision===d.key&&r.status==='completed');if(it.length)gps.push({...d,label:d.label+' Decision',items:it})});const pend=fl.filter(r=>!r.decision||r.status!=='completed');if(pend.length)gps.push({emoji:'⏳',label:'Pending',color:'#9ca3af',items:pend})}
    else if(groupBy==='journal'){const jm={};fl.forEach(r=>{const j=r.journal||'Unspecified';if(!jm[j])jm[j]=[];jm[j].push(r)});Object.entries(jm).sort((a,b)=>b[1].length-a[1].length).forEach(([j,items])=>gps.push({emoji:'📰',label:j,color:'#0ea5e9',items}));}
    else if(fl.length)gps.push({emoji:'📚',label:'All',color:'#059669',items:fl});
  }

  let gH='';
  if(!fl.length&&!baseData.length){
    gH=`<div class="ep"><div class="big">${isPapers?'📭':'📪'}</div><div class="mg">No ${isPapers?'submissions':'reviews'} yet</div><div class="su">Select “+ New” or import existing data to get started.</div><button class="ebtn" onclick="doImport()" style="margin-top:14px;font-size:12px;padding:8px 18px">📥 Import JSON Data</button></div>`;
  }else if(!fl.length){
    gH=`<div class="ep"><div class="su">No matching results</div></div>`;
  }else{
    gps.forEach((g,i)=>{
      let ch='';
      g.items.forEach(p=>{
        if(isPapers){
          ch+=renderPaperCard(p);
        }else{
          ch+=renderReviewCard(p);
        }
      });
      const cnColor=isPapers?g.color:'#059669';
      gH+=`<div class="gsec" style="animation-delay:${i*40}ms"><div class="gh"><span class="em">${g.emoji}</span><span class="lb">${g.label}</span><span class="cn" style="background:${cnColor}15;color:${cnColor}">${g.items.length}</span></div><div class="cg">${ch}</div></div>`;
    });
  }

  let dashContent='';
  let filtContent='';
  if(view==='dashboard'){
    dashContent=renderDashboard(fl);
    filtContent=renderFilterConsole();
  }

  let selectBar='';
  if(selectMode && view==='list'){
    selectBar=`<div class="select-mode-bar"><span class="select-count">${selectedIds.size} selected</span><div class="select-actions"><button class="ebtn" onclick="exitSelectMode()">Cancel</button><button class="ebtn" style="color:#dc2626;border-color:#fca5a5" onclick="batchDelete()">🗑 Delete Selected</button></div></div>`;
  }

  let bkH='';
  if(needsBackup()&&!isDismissed()){
    const lb=getLastBackup();
    bkH=`<div class="backup-bar"><div class="backup-banner">⚠️ <b>${lb?'Your last backup was over 7 days ago':'You have not backed up your data yet'}. Export a JSON copy for safekeeping.</b><button class="bbtn" id="bkExport">Back Up Now</button><span class="dismiss" id="bkDismiss" title="Dismiss for today">✕</span></div></div>`;
  }

  let stH='';
  if(isPapers){
    const summaryStatuses=ST.filter(s=>s.key!=='revision_under_review');
    const cnt={};summaryStatuses.forEach(s=>{cnt[s.key]=papers.filter(p=>statusCategory(p.status)===s.key).length});
    summaryStatuses.forEach(s=>{if(cnt[s.key])stH+=`<div class="sc">${s.emoji} ${s.label} <b>${cnt[s.key]}</b></div>`});
  }else{
    const total=reviews.length;
    const comp=reviews.filter(r=>r.status==='completed').length;
    const pend=reviews.filter(r=>r.status==='pending').length;
    stH=`<div class="sc">📪 Invitations <b>${total}</b></div><div class="sc">✅ Completed <b>${comp}</b></div><div class="sc">⏳ Pending <b>${pend}</b></div>`;
  }

  const newBtnClass=isPapers?'':'rev';
  const acTabClass=isPapers?'ac':'ac-rev';

  app.innerHTML=`
  <div class="header"><div class="hi"><div class="ha"><div><h1>📑 Submission & Peer Review Tracker</h1><p>${IS_LOCAL_BACKEND?'Git-trackable business data · Account details stay local':'Private Git-tracked data · Authenticated remote API'}</p>${storageStatusHTML()}</div><div class="hb"><button class="hbtn" onclick="doImport()">📥 Import</button><button class="hbtn" onclick="doExport()">📋 Export Backup</button><button class="hbtn ${newBtnClass}" id="xNew">+ New ${isPapers?'Submission':'Review'}</button><button class="hbtn" onclick="logout()">Lock</button></div></div>${(isPapers?papers:reviews).length?`<div class="sr">${stH}</div>`:''}</div></div>
  ${bkH}
  <div class="tabs">
    <button class="tab tab-main ${isPapers?acTabClass:''}" data-t="papers">📝 Submissions</button>
    <button class="tab tab-main ${!isPapers?acTabClass:''}" data-t="reviews">📪 Peer Reviews</button>
  </div>
  <div class="tabs" style="padding-top:0;border-bottom:none;margin-top:4px">
    <button class="tab ${view==='list'?'ac':''}" data-v="list">📋 List</button>
    <button class="tab ${view==='dashboard'?'ac':''}" data-v="dashboard">📊 Dashboard</button>
    ${view==='list'?`<button class="tab" onclick="toggleSelectMode()" style="margin-left:auto;font-size:12px">${selectMode?'Exit Multi-select':'☑️ Multi-select'}</button>`:''}
  </div>
  ${view==='list'?`
  <div class="tb">
    <div class="sbox"><span class="ic">🔍</span><input id="xSch" placeholder="Search titles, journals, co-authors, or tags..." value="${esc(search)}"></div>
    <div class="gtog">
      ${isPapers?`
      <button class="${groupBy==='status'?'ac':''}" data-g="status">Status</button>
      <button class="${groupBy==='role'?'ac':''}" data-g="role">Role</button>
      <button class="${groupBy==='journal'?'ac':''}" data-g="journal">Journal</button>
      <button class="${groupBy==='priority'?'ac':''}" data-g="priority">Priority</button>
      <button class="${groupBy==='none'?'ac':''}" data-g="none">All</button>
      `:`
      <button class="${groupBy==='status'?'ac-rev':''}" data-g="status">Status</button>
      <button class="${groupBy==='decision'?'ac-rev':''}" data-g="decision">Decision</button>
      <button class="${groupBy==='journal'?'ac-rev':''}" data-g="journal">Journal</button>
      <button class="${groupBy==='none'?'ac-rev':''}" data-g="none">All</button>
      `}
    </div>
  </div>
  `:''}
  <div class="ct ${view==='dashboard'?'dashboard-limited':''}">${selectBar}${view==='dashboard'?filtContent:''}${dashContent}${view==='list'?gH:''}</div>`;

  bindEvents();
}

function renderPaperCard(p){
  const st=gs(p.status),rl=gr(p.role);
  let qb='';ST.filter(s=>s.key!==p.status).forEach(s=>{qb+=`<button class="qb" title="${s.label}" data-id="${p.id}" data-st="${s.key}" onmouseenter="this.style.borderColor='${s.color}';this.style.background='${s.color}18'" onmouseleave="this.style.borderColor='';this.style.background=''">${s.emoji}</button>`});
  let pri='';const pv=p.priority||1;for(let i=1;i<=3;i++)pri+=`<span class="star ${i<=pv?'':'off'}" data-id="${p.id}" data-pr="${i}">★</span>`;
  const round=getWorkRound(p);const wc=getWorkCount(p.workId);
  const roundH=wc>1?`<span class="round-badge">Round ${round} of ${wc}</span>`:'';
  let histH='';
  if(p.workId&&wc>1){
    const chain=getWorkChain(p.workId);
    histH='<div class="hist-chain">';
    chain.forEach((cp,ci)=>{
      if(ci>0)histH+='<span class="hist-arrow">→</span>';
      histH+=`<span class="hist-link ${cp.id===p.id?'current':''}" data-goid="${cp.id}">${cp.journal||'?'} ${gs(cp.status).emoji}</span>`;
    });
    histH+='</div>';
  }
  let tlM='';
  if(p.timeline&&p.timeline.length){
    const last=p.timeline.slice(-3);
    tlM='<div class="ctlm">';last.forEach(ev=>{tlM+=`<div class="ev"><span class="dot" style="background:${ev.color||'#94a3b8'}"></span>${fD(ev.date)} · ${esc(ev.label)}</div>`});
    if(p.timeline.length>3)tlM+=`<div class="ev" style="opacity:.5">… ${p.timeline.length} events total</div>`;
    tlM+='</div>';
  }
  let tagH='';if(p.tags&&p.tags.length){tagH='<div class="tags-row">';p.tags.forEach(t=>{tagH+=`<span class="tag-sm">${esc(t)}</span>`});tagH+='</div>'}
  let metaH='';
  if(p.submittedDate)metaH+=`<span>Submitted: ${fD(p.submittedDate)}</span>`;
  if(p.submittedDate&&!['accepted','rejected','withdrawn'].includes(p.status)){const d=dB(p.submittedDate,td());if(d>0)metaH+=`<span>${d} days elapsed</span>`}
  if(p.manuscriptId)metaH+=`<span>${esc(p.manuscriptId)}</span>`;
  const dtd=daysToDeadline(p);
  if(dtd!==null&&dtd>=0&&p.status==='revision')metaH+=`<span class="${dtd<=7?'urgent':''}">⏰ ${dtd===0?'Due today':'Due in '+dtd+' days'}</span>`;
  else if(dtd!==null&&dtd<0&&p.status==='revision')metaH+=`<span class="urgent">⚠️ ${Math.abs(dtd)} days overdue</span>`;
  let exH='';if(p.trackingUrl)exH+=`<a class="clk" href="${esc(p.trackingUrl)}" target="_blank" onclick="event.stopPropagation()">🔗 Tracking Link</a>`;

  let selectCheckbox='';
  if(selectMode){
    selectCheckbox=`<div class="pc-select"><input type="checkbox" class="pc-checkbox" ${selectedIds.has(p.id)?'checked':''} onchange="toggleSelect('${p.id}')" onclick="event.stopPropagation()"></div>`;
  }

  // Account button
  let accBtn = '';
  if(p.account?.username){
    accBtn = `<button class="cact-btn" onclick="event.stopPropagation();openAccountModal('${p.id}','paper')">🔑 Account</button>`;
  }

  return `<div class="pc" data-eid="${p.id}">${selectCheckbox}${roundH}<div class="ab" style="background:${st.color}"></div><div class="card-body"><div class="ctop"><div class="ctt">${esc(p.title)||'(Untitled)'}</div></div><div class="card-info-stack"><div class="cjn">${p.journal?esc(p.journal):'<span style="opacity:.4;font-style:normal">Journal TBD</span>'}</div><div class="tag-stack"><span class="sbdg" style="background:${st.color}15;color:${st.color};border:1px solid ${st.color}30">${statusDisplayLabel(p)}</span><span class="rtag" style="background:${rl.bg};color:${rl.fg};border:1px solid ${rl.bd}">${roleDisplayLabel(p)}</span></div></div><div style="display:flex;justify-content:space-between;align-items:center"><div class="pri">${pri}</div><div class="qbs">${qb}</div></div>${metaH?`<div class="cmeta">${metaH}</div>`:''}${exH}${histH}${tagH}${tlM}</div><div class="cact"><div class="cact-left"><button class="cact-btn" onclick="event.stopPropagation();viewTimeline('${p.id}')">📅 Timeline</button>${accBtn}</div><button class="cact-btn cact-del" onclick="event.stopPropagation();deleteItem('${p.id}','paper')">🗑️</button></div></div>`;
}

function renderReviewCard(r){
  const st=grv(r.status), dec=gdec(r.decision);
  const isComp=r.status==='completed';
  const dimmed=isComp?'dimmed':'';

  let metaH='';
  if(r.inviteDate)metaH+=`<span>Invited: ${fD(r.inviteDate)}</span>`;
  const urg=getReviewUrgency(r);
  if(urg){
    metaH+=`<span class="${urg.urgent?'urgent':''}">⏰ ${urg.text}</span>`;
  }

  const round=getReviewRound(r);
  const rc=getReviewWorkCount(r.reviewWorkId);
  const roundH=rc>1?`<span class="round-badge" style="background:rgba(5,150,105,.1);color:var(--ac-rev)">Round ${round} of ${rc}</span>`:'';

  let histH='';
  if(r.reviewWorkId&&rc>1){
    const chain=getReviewChain(r.reviewWorkId);
    histH='<div class="hist-chain">';
    chain.forEach((cr,ci)=>{
      if(ci>0)histH+='<span class="hist-arrow">→</span>';
      const cst=grv(cr.status);
      histH+=`<span class="hist-link ${cr.id===r.id?'current':''}" onclick="event.stopPropagation();viewReviewDetail('${cr.id}')" style="${cr.id===r.id?'background:var(--ac-rev);color:#fff;border-color:var(--ac-rev)':''}">${cr.journal||'?'} ${cst.emoji}</span>`;
    });
    histH+='</div>';
  }

  let tlM='';
  if(r.timeline&&r.timeline.length){
    const last=r.timeline.slice(-2);
    tlM='<div class="ctlm">';last.forEach(ev=>{tlM+=`<div class="ev"><span class="dot" style="background:${ev.color||'#94a3b8'}"></span>${fD(ev.date)} · ${esc(ev.label)}</div>`});tlM+='</div>';
  }

  let selectCheckbox='';
  if(selectMode){
    selectCheckbox=`<div class="pc-select"><input type="checkbox" class="pc-checkbox" ${selectedIds.has(r.id)?'checked':''} onchange="toggleSelect('${r.id}')" onclick="event.stopPropagation()"></div>`;
  }

  // Account button
  let accBtn = '';
  if(r.account?.username){
    accBtn = `<button class="cact-btn rev" onclick="event.stopPropagation();openAccountModal('${r.id}','review')">🔑 Account</button>`;
  }

  return `<div class="pc ${dimmed}" data-rid="${r.id}">${selectCheckbox}${roundH}<div class="ab" style="background:${isComp?dec.color:st.color}"></div><div class="card-body"><div class="ctop"><div class="ctt">${esc(r.paperTitle)||'(Untitled Manuscript)'}</div></div><div class="card-info-stack"><div class="cjn">${r.journal?esc(r.journal):'<span style="opacity:.4;font-style:normal">Journal TBD</span>'}</div><div class="tag-stack"><span class="sbdg" style="background:${st.color}15;color:${st.color};border:1px solid ${st.color}30">${st.label}</span>${r.decision&&isComp?`<span class="sbdg" style="background:${dec.color}15;color:${dec.color};border:1px solid ${dec.color}30">${dec.label}</span>`:''}</div></div>${metaH?`<div class="cmeta">${metaH}</div>`:''}${r.link?`<a class="clk" href="${esc(r.link)}" target="_blank" onclick="event.stopPropagation()">🔗 Review Link</a>`:''}${histH}${tlM}</div><div class="cact"><div class="cact-left"><button class="cact-btn rev" onclick="event.stopPropagation();completeReview('${r.id}')">${isComp?'✏️ Update Decision':'✅ Complete'}</button>${accBtn}</div><button class="cact-btn cact-del" onclick="event.stopPropagation();deleteItem('${r.id}','review')">🗑️</button></div></div>`;
}

function renderDashboard(data){
  const isPapers=mainTab==='papers';
  let h='<div class="dash">';
  if(isPapers){
    const total=data.length;
    const active=data.filter(p=>!['accepted','rejected','withdrawn'].includes(p.status)).length;
    const acc=countTimelineEvents(data,'Accepted');
    const rej=countTimelineEvents(data,'Rejected');
    const avgP=data.filter(p=>p.submittedDate&&['accepted','rejected'].includes(p.status)&&p.timeline&&p.timeline.length>1);
    let avg=0;if(avgP.length){avg=Math.round(avgP.reduce((s,p)=>{const l=p.timeline[p.timeline.length-1];return s+dB(p.submittedDate,l.date||td())},0)/avgP.length)}
    const rate=acc+rej>0?Math.round(acc/(acc+rej)*100):0;
    const workIds=new Set(data.filter(p=>p.workId).map(p=>p.workId));
    const uniqueWorks=workIds.size+(data.filter(p=>!p.workId).length);
    h+=`
      <div class="dash-c"><div class="num">${total}</div><div class="lbl">Submission Attempts</div></div>
      <div class="dash-c"><div class="num">${uniqueWorks}</div><div class="lbl">Manuscripts</div></div>
      <div class="dash-c"><div class="num">${active}</div><div class="lbl">In Progress</div></div>
      <div class="dash-c"><div class="num" style="color:#22c55e">${acc}</div><div class="lbl">Acceptance Events</div></div>
      <div class="dash-c"><div class="num" style="color:#ef4444">${rej}</div><div class="lbl">Rejection Events</div></div>
      <div class="dash-c"><div class="num">${avg||'—'}</div><div class="lbl">Avg. Review Days</div></div>
      <div class="dash-c"><div class="num" style="color:#22c55e">${rate}%</div><div class="lbl">Acceptance Rate</div></div>
    `;
  }else{
    const total=data.length;
    const comp=data.filter(r=>r.status==='completed').length;
    const pend=data.filter(r=>r.status==='pending').length;
    const decDist={};RV_DEC.slice(1).forEach(d=>decDist[d.key]=data.filter(r=>r.decision===d.key).length);
    const avgDays=comp?Math.round(data.filter(r=>r.status==='completed'&&r.inviteDate).reduce((s,r)=>s+dB(r.inviteDate,td()),0)/comp):0;
    h+=`
      <div class="dash-c"><div class="num rev">${total}</div><div class="lbl">Review Invitations</div></div>
      <div class="dash-c"><div class="num rev" style="color:#22c55e">${comp}</div><div class="lbl">Completed</div></div>
      <div class="dash-c"><div class="num rev" style="color:#f59e0b">${pend}</div><div class="lbl">Pending</div></div>
      <div class="dash-c"><div class="num rev">${avgDays||'—'}</div><div class="lbl">Avg. Turnaround Days</div></div>
      <div class="dash-c"><div class="num rev" style="color:#22c55e">${decDist.accept||0}</div><div class="lbl">Recommend Accept</div></div>
      <div class="dash-c"><div class="num rev" style="color:#ef4444">${decDist.reject||0}</div><div class="lbl">Recommend Reject</div></div>
    `;
  }
  h+='</div>';

  h+='<div class="chart-grid">';
  h+='<div class="chart-box"><h4>Trend Analysis</h4><div class="chart-container"><canvas id="chartTrend"></canvas></div></div>';
  h+='<div class="chart-box"><h4>Status Distribution</h4><div class="chart-container"><canvas id="chartPie"></canvas></div></div>';
  h+='</div>';

  h+='<div class="chart-large-box">';
  h+='<h4>Journal Statistics by Year</h4>';
  h+='<div class="chart-container-large">';
  h+='<div class="chart-area"><canvas id="chartJournalTrend"></canvas></div>';
  h+='<div class="legend-area" id="journalLegend"></div>';
  h+='</div>';
  h+='</div>';

  setTimeout(()=>drawCharts(data),100);

  return h;
}

function renderFilterConsole(){
  const isPapers=mainTab==='papers';
  const baseData=isPapers?papers:reviews;

  const years=[...new Set(baseData.map(x=>x.submittedDate||x.inviteDate).filter(d=>d).map(d=>d.slice(0,4)))].sort().reverse();
  let months=[];
  if(filterYear){
    months=[...new Set(baseData.filter(x=>{
      const d=x.submittedDate||x.inviteDate;
      return d&&d.slice(0,4)===filterYear;
    }).map(x=>{
      const d=x.submittedDate||x.inviteDate;
      return d?d.slice(5,7):'';
    }))].filter(m=>m).sort();
  }
  const journals=[...new Set(baseData.map(x=>x.journal).filter(j=>j))].sort();

  return `<div class="filt-console">
    <div class="filt-grp"><label>Year</label><select id="filtYear" onchange="updateFilter('year',this.value)"><option value="">All</option>${years.map(y=>`<option value="${y}" ${filterYear===y?'selected':''}>${y}</option>`).join('')}</select></div>
    <div class="filt-grp"><label>Month</label><select id="filtMonth" onchange="updateFilter('month',this.value)" ${!filterYear?'disabled':''}><option value="">All</option>${months.map(m=>`<option value="${m}" ${filterMonth===m?'selected':''}>${m}</option>`).join('')}</select></div>
    <div class="filt-grp"><label>Journal</label><select id="filtJour" onchange="updateFilter('journal',this.value)"><option value="">All Journals</option>${journals.map(j=>`<option value="${esc(j)}" ${filterJournal===j?'selected':''}>${esc(j)}</option>`).join('')}</select></div>
    <button class="ebtn" onclick="clearFilters()" style="height:fit-content">Reset Filters</button>
  </div>`;
}

function drawCharts(data){
  const isPapers=mainTab==='papers';
  if(!data.length)return;

  const ctx1=document.getElementById('chartTrend');
  const ctx2=document.getElementById('chartPie');
  const ctx3=document.getElementById('chartJournalTrend');
  if(!ctx1||!ctx2||!ctx3)return;

  if(chartInstance1)chartInstance1.destroy();
  if(chartInstance2)chartInstance2.destroy();
  if(chartInstance3)chartInstance3.destroy();

  Chart.defaults.font.family="'Inter',sans-serif";
  Chart.defaults.font.size=11;

  const activityByMonth={};
  data.forEach(x=>{
    const d=x.submittedDate||x.inviteDate;
    if(!d)return;
    const k=d.slice(0,7);
    activityByMonth[k]=(activityByMonth[k]||0)+1;
  });
  const acceptanceByMonth=isPapers?countTimelineEventsByMonth(data,'Accepted'):{};
  const rejectionByMonth=isPapers?countTimelineEventsByMonth(data,'Rejected'):{};
  const sortedDates=[...new Set([
    ...Object.keys(activityByMonth),
    ...Object.keys(acceptanceByMonth),
    ...Object.keys(rejectionByMonth)
  ])].sort();
  const trendDatasets=[{
    label:isPapers?'Submissions':'Reviews',
    data:sortedDates.map(k=>activityByMonth[k]||0),
    borderColor:isPapers?'#7c3aed':'#059669',
    backgroundColor:isPapers?'#7c3aed':'rgba(5,150,105,0.1)',
    fill:!isPapers,
    tension:0.4,
    pointRadius:5,
    pointHoverRadius:7,
    pointBackgroundColor:isPapers?'#7c3aed':'#059669',
    pointBorderColor:'#fff',
    pointBorderWidth:2
  }];
  if(isPapers){
    trendDatasets.push({
      label:'Acceptances',
      data:sortedDates.map(k=>acceptanceByMonth[k]||0),
      borderColor:'#22c55e',
      backgroundColor:'#22c55e',
      fill:false,
      tension:0.4,
      pointRadius:5,
      pointHoverRadius:7,
      pointBackgroundColor:'#22c55e',
      pointBorderColor:'#fff',
      pointBorderWidth:2
    },{
      label:'Rejections',
      data:sortedDates.map(k=>rejectionByMonth[k]||0),
      borderColor:'#ef4444',
      backgroundColor:'#ef4444',
      fill:false,
      tension:0.4,
      pointRadius:5,
      pointHoverRadius:7,
      pointBackgroundColor:'#ef4444',
      pointBorderColor:'#fff',
      pointBorderWidth:2
    });
  }

  chartInstance1=new Chart(ctx1,{
    type:'line',
    data:{
      labels:sortedDates.map(k=>k.replace('-','/')),
      datasets:trendDatasets
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{
        legend:{display:isPapers,position:'top',labels:{boxWidth:12,usePointStyle:true}},
        datalabels:{
          display:true,
          align:'top',
          offset:4,
          font:{weight:'bold'},
          formatter:v=>v>0?v:''
        }
      },
      scales:{y:{beginAtZero:true,ticks:{stepSize:1}}}
    }
  });

  let statData,labels,colors;
  if(isPapers){
    const chartStatuses=ST.filter(s=>s.key!=='revision_under_review').map(s=>({...s,count:data.filter(x=>statusCategory(x.status)===s.key).length})).filter(s=>s.count>0);
    statData=chartStatuses.map(s=>s.count);
    labels=chartStatuses.map(s=>s.label);
    colors=chartStatuses.map(s=>s.color);
  }else{
    const decisionStats=RV_DEC.map(d=>({...d,count:data.filter(x=>x.decision===d.key).length})).filter(d=>d.count>0);
    statData=decisionStats.map(d=>d.count);
    labels=decisionStats.map(d=>d.label);
    colors=decisionStats.map(d=>d.color);
  }

  chartInstance2=new Chart(ctx2,{
    type:'doughnut',
    data:{labels,datasets:[{data:statData,backgroundColor:colors,borderWidth:0}]},
    options:{
      responsive:true,
      maintainAspectRatio:false,
      cutout:'60%',
      plugins:{
        legend:{position:'right',labels:{boxWidth:12}},
        datalabels:{
          display:true,
          formatter:(v,ctx)=>v>0?v:'',
          color:'#fff',
          font:{weight:'bold',size:11}
        }
      }
    }
  });

  const journalYears={};
  const journalSet=new Set();

  data.forEach(x=>{
    const d=x.submittedDate||x.inviteDate;
    if(!d||!x.journal)return;
    const year=d.slice(0,4);
    if(!journalYears[year])journalYears[year]={};
    if(!journalYears[year][x.journal])journalYears[year][x.journal]=0;
    journalYears[year][x.journal]++;
    journalSet.add(x.journal);
  });

  const years=Object.keys(journalYears).sort();
  const journals=Array.from(journalSet).sort();
  const journalColors=['#7c3aed','#0ea5e9','#22c55e','#f59e0b','#ef4444','#a855f7','#ec4899','#14b8a6','#f97316','#6366f1','#8b5cf6','#06b6d4'];

  const datasets=journals.map((j,idx)=>({
    label:j,
    data:years.map(y=>(journalYears[y]&&journalYears[y][j])||0),
    borderColor:journalColors[idx%journalColors.length],
    backgroundColor:journalColors[idx%journalColors.length],
    tension:0.3,
    pointRadius:5,
    pointHoverRadius:7,
    borderWidth:2
  }));

  chartInstance3=new Chart(ctx3,{
    type:'line',
    data:{
      labels:years,
      datasets:datasets
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        datalabels:{
          display:true,
          align:'bottom',
          offset:4,
          font:{size:10},
          formatter:v=>v>0?v:''
        },
        tooltip:{
          mode:'index',
          intersect:false,
          callbacks:{
            title:(items)=>items[0].label,
            label:(item)=>`${item.dataset.label}: ${item.raw}`
          }
        }
      },
      scales:{
        y:{beginAtZero:true,ticks:{stepSize:1},grid:{color:'rgba(0,0,0,0.05)'}},
        x:{grid:{display:false}}
      }
    }
  });

  const legendContainer=document.getElementById('journalLegend');
  if(legendContainer){
    legendContainer.innerHTML='';
    journals.forEach((j,idx)=>{
      const color=journalColors[idx%journalColors.length];
      const item=document.createElement('div');
      item.className='legend-item';
      item.innerHTML=`<div class="legend-color" style="background:${color}"></div><div class="legend-text">${esc(j)}</div>`;
      item.onclick=()=>{
        const meta=chartInstance3.getDatasetMeta(idx);
        meta.hidden=meta.hidden===null?!chartInstance3.data.datasets[idx].hidden:null;
        item.classList.toggle('hidden',meta.hidden);
        chartInstance3.update();
      };
      legendContainer.appendChild(item);
    });
  }
}

function updateFilter(type,value){
  if(type==='year'){filterYear=value;filterMonth='';}
  else if(type==='month')filterMonth=value;
  else if(type==='journal')filterJournal=value;
  render();
}
function clearFilters(){
  filterYear='';filterMonth='';filterJournal='';
  render();
}

function toggleSelectMode(){
  selectMode=!selectMode;
  selectedIds.clear();
  render();
}
function exitSelectMode(){
  selectMode=false;
  selectedIds.clear();
  render();
}
function toggleSelect(id){
  if(selectedIds.has(id))selectedIds.delete(id);
  else selectedIds.add(id);
  render();
}
function batchDelete(){
  if(selectedIds.size===0)return;
  if(!confirm(`Delete the ${selectedIds.size} selected records? This action cannot be undone.`))return;

  const isPapers=mainTab==='papers';
  if(isPapers){
    papers=papers.filter(p=>!selectedIds.has(p.id));
  }else{
    reviews=reviews.filter(r=>!selectedIds.has(r.id));
  }
  const count=selectedIds.size;
  selectedIds.clear();
  persist();
  toast(`${count} records deleted`);
}

function deleteItem(id,type){
  if(!confirm('Delete this record?'))return;
  if(type==='paper'){
    papers=papers.filter(p=>p.id!==id);
  }else{
    reviews=reviews.filter(r=>r.id!==id);
  }
  persist();
  toast('Deleted');
}

function viewTimeline(id){
  detailId=id;
  render();
}
function viewReviewDetail(id){
  editing=reviews.find(r=>r.id===id);
  if(editing)showForm();
}

function completeReview(rid){
  const r=reviews.find(x=>x.id===rid);
  if(!r)return;

  const dec=prompt('Review decision? Enter: accept / minor / major / reject');
  if(!dec)return;

  const decMap={accept:'accept',minor:'minor',major:'major',reject:'reject'};
  const dk=decMap[dec.toLowerCase()];
  if(!dk){toast('Invalid input','error');return;}

  r.decision=dk;
  r.status='completed';
  if(!r.timeline)r.timeline=[];
  r.timeline.push({id:uid(),date:td(),label:`Review submitted: ${gdec(dk).label}`,color:gdec(dk).color,note:''});
  persist();
  toast('Completed review saved');
}

function bindEvents(){
  const isPapers=mainTab==='papers';

  document.getElementById('xNew').onclick=()=>{editing='new';showForm()};

  const searchInput=document.getElementById('xSch');
  if(searchInput){
    searchInput.oninput=e=>{
      if(searchTimeout)clearTimeout(searchTimeout);
      searchTimeout=setTimeout(()=>{
        search=e.target.value;
        render();
      },300);
    };
  }

  document.querySelectorAll('.gtog button').forEach(b=>{
    b.onclick=()=>{groupBy=b.dataset.g;render()}
  });

  document.querySelectorAll('.tab[data-v]').forEach(b=>{
    b.onclick=()=>{view=b.dataset.v;render()}
  });

  document.querySelectorAll('.tab[data-t]').forEach(b=>{
    b.onclick=()=>{mainTab=b.dataset.t;groupBy='status';search='';view='list';clearFilters();exitSelectMode();}
  });

  if(isPapers){
    document.querySelectorAll('.pc[data-eid]').forEach(c=>{
      c.onclick=e=>{
        if(e.target.closest('.qb')||e.target.closest('.clk')||e.target.closest('.star')||e.target.closest('.hist-link')||e.target.closest('.cact-btn')||e.target.closest('.pc-select'))return;
        editing=papers.find(p=>p.id===c.dataset.eid);
        if(editing)showForm();
      }
    });
    document.querySelectorAll('.qb').forEach(b=>{
      b.onclick=e=>{
        e.stopPropagation();
        const p=papers.find(x=>x.id===b.dataset.id);
        if(p){
          p.status=b.dataset.st;
          if(p.status!=='revision')p.deadline='';
          if(!p.timeline)p.timeline=[];
          p.timeline.push({id:uid(),date:td(),label:gs(b.dataset.st).label,color:gs(b.dataset.st).color,note:''});
          persist();
        }
      }
    });
    document.querySelectorAll('.star').forEach(s=>{
      s.onclick=e=>{
        e.stopPropagation();
        const p=papers.find(x=>x.id===s.dataset.id);
        if(p){p.priority=parseInt(s.dataset.pr);persist()}
      }
    });
    document.querySelectorAll('.hist-link').forEach(l=>{
      l.onclick=e=>{
        e.stopPropagation();
        const id=l.dataset.goid;
        if(id){detailId=id;render()}
      }
    });
  }else{
    document.querySelectorAll('.pc[data-rid]').forEach(c=>{
      c.onclick=e=>{
        if(e.target.closest('.cact-btn')||e.target.closest('.clk')||e.target.closest('.pc-select')||e.target.closest('.hist-link'))return;
        editing=reviews.find(r=>r.id===c.dataset.rid);
        if(editing)showForm();
      }
    });
  }

  const bke=document.getElementById('bkExport');
  if(bke)bke.onclick=doExport;
  const bkd=document.getElementById('bkDismiss');
  if(bkd)bkd.onclick=()=>{dismissBackup();render()};
}

function renderDetail(){
  const p=papers.find(x=>x.id===detailId);
  if(!p){detailId=null;render();return}

  const st=gs(p.status),rl=gr(p.role);
  const tl=(p.timeline||[]).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const totalDays=p.submittedDate?dB(p.submittedDate,tl.length&&tl[tl.length-1].date?tl[tl.length-1].date:td()):0;

  let tlH='';
  tl.forEach((ev,i)=>{
    let dur='';if(i>0&&tl[i-1].date&&ev.date){const d=dB(tl[i-1].date,ev.date);if(d>0)dur=`${d}-day interval`}
    tlH+=`<div class="ev"><div class="dot" style="background:${ev.color||'#94a3b8'}"></div><div class="date">${fD(ev.date)}</div><div class="label">${esc(ev.label)}</div>${ev.note?`<div class="note">${esc(ev.note)}</div>`:''}${dur?`<div class="dur">${dur}</div>`:''}</div>`;
  });
  if(!tl.length)tlH='<div style="color:var(--t3);font-size:12px;padding:8px 0">No events yet. Select Edit to add one.</div>';

  let histViewH='';
  if(p.workId&&getWorkCount(p.workId)>1){
    const chain=getWorkChain(p.workId);
    let items='';chain.forEach((cp,ci)=>{
      const cst=gs(cp.status);
      items+=`<div class="hist-chain-item" data-goid="${cp.id}"><span class="round">Round ${ci+1}</span><div class="info"><div class="jn">${esc(cp.journal||'Unspecified')}</div><div class="tt">${esc(cp.title)}</div><div class="dates">${fD(cp.submittedDate)||'Not submitted'} ${cp.submittedDate&&!['preparing'].includes(cp.status)?'· '+dB(cp.submittedDate,td())+' days':''}${cp.id===p.id?' · Currently viewing':''}</div></div><span class="sbdg" style="background:${cst.color}15;color:${cst.color};border:1px solid ${cst.color}30">${statusDisplayLabel(cp)}</span></div>`;
    });
    histViewH=`<div class="hist-view"><h3>📜 Submission History (multiple rounds for the same work)</h3><div class="hist-chain-full">${items}</div></div>`;
  }

  let accountBtn='';
  if(p.account?.username){
    accountBtn=`<button class="ebtn" onclick="openAccountModal('${p.id}','paper')" style="margin-bottom:12px">🔑 View System Account</button>`;
  }

  document.getElementById('app').innerHTML=`
  <div class="header"><div class="hi"><div class="ha"><div><h1>📑 Submission & Peer Review Tracker</h1>${storageStatusHTML()}</div><div class="hb"><button class="hbtn" onclick="logout()">Lock</button></div></div></div></div>
  <div class="ct">
    <div class="det-hd"><div class="bk" id="goBack">← Back to List</div><h2>${esc(p.title)}</h2><div class="meta">
      <span class="sbdg" style="background:${st.color}15;color:${st.color};border:1px solid ${st.color}30">${statusDisplayLabel(p)}</span>
      <span class="rtag" style="background:${gr(p.role).bg};color:${gr(p.role).fg};border:1px solid ${gr(p.role).bd}">${roleDisplayLabel(p)}</span>
      ${p.journal?`<span style="font-style:italic">${esc(p.journal)}</span>`:''}
      ${p.manuscriptId?`<span>${esc(p.manuscriptId)}</span>`:''}
      ${totalDays?`<span>${totalDays} days total</span>`:''}
    </div></div>
    ${histViewH}
    <div class="det-tl">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h3>📅 Full Timeline</h3>
        <button class="ebtn" id="editP">✏️ Edit</button>
      </div>
      ${accountBtn}
      <div class="ftl">${tlH}</div>
    </div>
  </div>`;

  document.getElementById('goBack').onclick=()=>{detailId=null;render()};
  document.getElementById('editP').onclick=()=>{editing=papers.find(x=>x.id===detailId);if(editing)showForm()};
  document.querySelectorAll('.hist-chain-item').forEach(c=>{c.onclick=()=>{detailId=c.dataset.goid;render()}});

function openAccountModal(id,type){
  const isPaper=type==='paper';
  const item=(isPaper?papers:reviews).find(x=>x.id===id);
  if(!item||!item.account)return;

  const ov=document.createElement('div');
  ov.className='mo';
  ov.innerHTML=`<div class="acc-modal"><h3 style="font-size:14px;margin-bottom:16px">🔑 System Account</h3>
    <div class="acc-row">
      <label>Username / Email</label>
      <div class="acc-input-wrap">
        <input type="text" value="${esc(item.account.username)}" readonly>
      </div>
    </div>
    <div class="acc-row">
      <label>Password</label>
      <div class="acc-input-wrap">

      </div>
    </div>
    <div class="acc-btns">
      <button onclick="this.closest('.mo').remove()">Close</button>
      <button class="primary ${isPaper?'':'rev'}" onclick="copyAccount('${id}','${type}')">Copy Credentials</button>

function toggleModalPwd(){
  const input=document.getElementById('accPwdDisplay');
  const btn=input.nextElementSibling;
  if(input.type==='password'){
    input.type='text';
    btn.textContent='🙈';
  }else{
    input.type='password';
    btn.textContent='👁️';
  }
}

function copyAccount(id,type){
  const item=(type==='paper'?papers:reviews).find(x=>x.id===id);
  if(item&&item.account){
    const text=`Account: ${item.account.username}\nPassword: ${item.account.password}`;
    navigator.clipboard.writeText(text).then(()=>{
      toast('Account credentials copied to the clipboard');
      document.querySelector('.mo').remove();
    });
  }
}
